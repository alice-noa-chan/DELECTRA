[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deletcra"
version = "0.1.0"
description = "Causal ELECTRA experiments with replaced-token detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = ["torch>=2.5,<3", "transformers>=4.57,<5"]

[project.scripts]
deletcra = "deletcra.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
data = ["datasets>=3,<5"]
cloud = ["modal>=1.6,<2"]
kernels = ["liger-kernel==0.8.4; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
